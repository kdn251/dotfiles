<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- MPV/libass needs outline glyphs, not bitmap-only color emoji. -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Stream Emoji</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Emoji</string></edit>
    <edit name="color" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
