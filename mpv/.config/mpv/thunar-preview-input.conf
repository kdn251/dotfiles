# Bindings for the Thunar Space-bar quick preview (thunar-preview.sh).
# Only this preview instance uses these (--no-config); normal mpv is unaffected.
SPACE quit
ESC quit
q quit
ENTER quit
RIGHT playlist-next
LEFT playlist-prev
DOWN playlist-next
UP playlist-prev
j playlist-next
k playlist-prev
# Same zoom/pan controls as regular mpv (~/.config/mpv/input.conf)
Shift+= add video-zoom 0.1
Shift+- add video-zoom -0.1
Shift+) set video-zoom 0; set video-pan-x 0; set video-pan-y 0; show-text "Reset view"
Shift+h add video-pan-x 0.05
Shift+l add video-pan-x -0.05
Shift+k add video-pan-y 0.05
Shift+j add video-pan-y -0.05
