# Lofree Flow84 (Bluetooth, Mac layout, shows up as 05ac:024f).
# Swap Command<->Option so physical Command = Alt (Hyprland $mainMod)
# and physical Option = Super. Carry over the capslock overload from default.conf
# because a device matched by an explicit id is not also matched by the '*' config.
[ids]
05ac:024f

[main]
leftmeta = layer(alt)
leftalt = layer(meta)
rightmeta = layer(alt)
rightalt = layer(meta)
capslock = overload(caps_layer, capslock)

[caps_layer]
h = left
j = down
k = up
l = right
