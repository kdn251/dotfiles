general {
    # Keep manual `loginctl lock-session` and `hyprlock` available.
    lock_cmd = pidof hyprlock || hyprlock
    # Do not lock automatically before sleep or hold up suspend for a lock.
    inhibit_sleep = 0
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Automatic idle locking and display power-off are disabled for TV use.
