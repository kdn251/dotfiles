# Observe mouse presses without consuming the click destined for the app.
bindn = , mouse:272, exec, ~/scripts/waybar-dismiss-outside.py
bindn = , mouse:273, exec, ~/scripts/waybar-dismiss-outside.py
bindn = , mouse:274, exec, ~/scripts/waybar-dismiss-outside.py

# LocalSend dropdown, matching the Proton VPN panel.
windowrule = float on, opaque on, size 480 700, move ((monitor_w-490)) (50), match:class ^(org\.localsend\.localsend_app)$
