general {
    # Watchdog relaunches hyprlock if Hyprland disconnects it during a docked resume
    # (see ~/scripts/hyprlock-watchdog.sh); it also refuses to start a second hyprlock.
    lock_cmd = $HOME/scripts/hyprlock-watchdog.sh
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display
}

listener {
    timeout = 300 # 5min
    on-timeout = loginctl lock-session          # lock screen when timeout has passed
}

listener {
    timeout = 330 # 5.5min
    on-timeout = hyprctl dispatch dpms off      # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on        # Add this line
}

