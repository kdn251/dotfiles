--enable-features=TouchpadOverscrollHistoryNavigation
# DevTools protocol, used by ~/scripts/yt-pip-cdp.py to toggle picture-in-picture
# directly instead of driving the context menu.
#
# SECURITY: this port is unauthenticated and gives ANY local process full
# control of the browser -- cookies, sessions, acting as you on logged-in
# sites. It is open for the life of the browser, not just while the hotkey
# runs. Remove this line to close it (requires a Brave restart either way,
# since the flag is read only at process startup).
--remote-debugging-port=9222
